services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    networks: [data]
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_tls:/var/lib/postgresql/tls
      - postgres_trust:/var/lib/postgresql/trust
    healthcheck:
      test: [CMD-SHELL, "PGPASSWORD=\"$$POSTGRES_PASSWORD\" PGSSLMODE=verify-full PGSSLROOTCERT=/var/lib/postgresql/trust/ca.crt psql -h postgres -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -Atqc 'SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()' | grep -qx t"]
      interval: 10s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    networks: [data]
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 15
  medusa:
    networks: [default, data]
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        MEDUSA_BACKEND_URL: https://api.mukkys3d.com
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "9000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/medusa-store
      DATABASE_SSL: "true"
      DATABASE_SSL_CA_FILE: /run/postgres-trust/ca.crt
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET}
      AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SHOP_EMAIL_ENABLED: ${SHOP_EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Mukky's 3D Shop}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      STOREFRONT_URL: https://mukkys3d.com
      ORDER_TRANSFER_EMAIL_ENABLED: ${ORDER_TRANSFER_EMAIL_ENABLED:-false}
      WEIGHT_SHIPPING_SERVICES: ${WEIGHT_SHIPPING_SERVICES:-[]}
      STORE_CORS: https://mukkys3d.com,https://www.mukkys3d.com,https://mukkys3d.co.uk,https://www.mukkys3d.co.uk,https://shop.channelkhan.com
      ADMIN_CORS: https://admin.mukkys3d.com,https://api.mukkys3d.com,https://shopadmin.channelkhan.com,https://api.channelkhan.com
      AUTH_CORS: https://mukkys3d.com,https://www.mukkys3d.com,https://mukkys3d.co.uk,https://www.mukkys3d.co.uk,https://shop.channelkhan.com,https://admin.mukkys3d.com,https://api.mukkys3d.com,https://shopadmin.channelkhan.com,https://api.channelkhan.com
      MEDUSA_BACKEND_URL: https://api.mukkys3d.com
    volumes:
      - uploads:/server/apps/backend/.medusa/server/static
      - postgres_trust:/run/postgres-trust:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5
  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://api.mukkys3d.com
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:?Set MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_BASE_URL: https://mukkys3d.com
        NEXT_PUBLIC_STRIPE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    depends_on:
      medusa:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://api.mukkys3d.com
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:?Set MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_BASE_URL: https://mukkys3d.com
      NEXT_PUBLIC_DEFAULT_REGION: gb
      NEXT_PUBLIC_STRIPE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/', { signal: AbortSignal.timeout(8000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
volumes:
  postgres_data:
  postgres_tls:
  postgres_trust:
  uploads:
  redis_data:
networks:
  data:
    internal: true
